<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Happy Birthday 🎂</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
height:100vh;
font-family:Arial,sans-serif;
background:black;
}

/* ================= COUNTDOWN SCREEN ================= */

#countdownScreen{
position:fixed;
inset:0;
display:flex;
justify-content:center;
align-items:center;

background:
linear-gradient(-45deg,
#ff0080,
#7928ca,
#00d4ff,
#ff5e62);

background-size:400% 400%;

animation:bgmove 8s infinite;

z-index:99999;
}

.countBox{
text-align:center;
padding:30px;
color:white;
}

.countBox h1{
font-size:36px;
margin-bottom:20px;
font-family:'Pacifico',cursive;
}

#timer{

font-size:34px;
font-weight:bold;

text-shadow:
0 0 10px white,
0 0 30px white;

animation:pulse 1s infinite;

margin-bottom:15px;
}

@keyframes bgmove{

0%{
background-position:0% 50%;
}

50%{
background-position:100% 50%;
}

100%{
background-position:0% 50%;
}

}

/* ================= MAIN PAGE ================= */

#mainPage{

display:none;

overflow:hidden;

height:100vh;

background:
linear-gradient(-45deg,
#ff0080,
#7928ca,
#2af598,
#ff5e62);

background-size:400% 400%;

animation:bgmove 10s ease infinite;

display:flex;
justify-content:center;
align-items:center;

}


.container{

width:100%;
padding:20px;
text-align:center;
position:relative;
z-index:5;
}

.title{

font-family:'Pacifico',cursive;

font-size:42px;

color:white;

text-shadow:
0 0 10px white,
0 0 20px #ff00ff,
0 0 40px #ff00ff;

animation:zoom 2s infinite alternate;
}

@keyframes zoom{

from{
transform:scale(1)
}

to{
transform:scale(1.08)
}

}

.typing{

margin-top:15px;

font-size:24px;

color:yellow;

font-weight:bold;

white-space:nowrap;

overflow:hidden;

border-right:3px solid white;

width:0;

margin:auto;

animation:
typing 4s steps(20) forwards,
blink .7s infinite;

}

@keyframes typing{

to{
width:220px;
}

}

@keyframes blink{

50%{
border-color:transparent;
}

}

/* photo */

.photoBox{

margin:auto;

margin-top:25px;

width:220px;
height:220px;

border-radius:50%;

padding:6px;

background:
linear-gradient(
45deg,
yellow,
cyan,
magenta,
red
);

animation:rotate 5s linear infinite;
}

.photo{

width:100%;
height:100%;

border-radius:50%;
overflow:hidden;

}

.photo img{

width:100%;
height:100%;

object-fit:cover;

}

@keyframes rotate{

100%{
transform:rotate(360deg)
}

}

/* background floating images */

.floating{

position:absolute;

width:70px;

opacity:.35;

z-index:1;

animation:floatAround linear infinite;

pointer-events:none;

}

.bg1{
left:5%;
top:85%;
animation-duration:18s;
}

.bg2{
left:20%;
top:100%;
animation-duration:22s;
}

.bg3{
left:40%;
top:90%;
animation-duration:16s;
}

.bg4{
left:60%;
top:110%;
animation-duration:20s;
}

.bg5{
left:80%;
top:95%;
animation-duration:17s;
}

.bg6{
left:90%;
top:105%;
animation-duration:25s;
}

@keyframes floatAround{

0%{
transform:
translateY(0)
translateX(0)
rotate(0deg);
}

50%{
transform:
translateY(-50vh)
translateX(20px)
rotate(180deg);
}

100%{
transform:
translateY(-130vh)
translateX(-20px)
rotate(360deg);
}

}

/* balloons */

.balloon{

position:absolute;

bottom:-200px;

font-size:65px;

animation:fly linear infinite;

}

.balloon:nth-child(1){

left:5%;

animation-duration:8s;

}

.balloon:nth-child(2){

left:25%;

animation-duration:11s;

}

.balloon:nth-child(3){

left:45%;

animation-duration:9s;

}

.balloon:nth-child(4){

left:70%;

animation-duration:7s;

}

.balloon:nth-child(5){

left:90%;

animation-duration:12s;

}

@keyframes fly{

0%{
transform:translateY(0)
}

100%{
transform:translateY(-120vh)
}

}

.message{

margin-top:20px;

font-size:18px;

color:white;

line-height:1.6;

padding:10px;

}

.btn{

margin-top:20px;

padding:15px 35px;

font-size:18px;

border:none;

border-radius:50px;

background:white;

font-weight:bold;

animation:pulse 1s infinite;

}

@keyframes pulse{

50%{
transform:scale(1.1)
}

}

.confetti{

position:absolute;

width:10px;
height:20px;

top:-20px;

animation:fall linear infinite;

}

@keyframes fall{

0%{
transform:translateY(0) rotate(0)
}

100%{
transform:translateY(120vh) rotate(720deg)
}

}

</style>
</head>
<body>


<!-- COUNTDOWN -->

<div id="countdownScreen">

<div class="countBox">

<h1>🎂 Birthday Countdown 🎂</h1>

<div id="timer"></div>

<p>Waiting for the special day ✨</p>

</div>

</div>


<!-- MAIN BIRTHDAY PAGE -->

<div id="mainPage">


<img class="floating bg1"
src="1.jpg">

<img class="floating bg2"
src="2.jpg">

<img class="floating bg3"
src="3.jpg">

<img class="floating bg4"
src="4.jpg">

<img class="floating bg5"
src="5.jpg">

<img class="floating bg6"
src="6.jpg">


<div class="balloon">🎈</div>
<div class="balloon">🎈</div>
<div class="balloon">🎈</div>
<div class="balloon">🎈</div>
<div class="balloon">🎈</div>


<div class="container">

<div class="title">
🎉 Happy Birthday 🎉
</div>

<div class="typing">
Dear Best Friend ❤️
</div>


<div class="photoBox">

<div class="photo">

<img src="1.jpeg">

</div>

</div>


<div class="message">

May your life be full of happiness, joy and endless success 🎂✨❤️

</div>


<button class="btn" onclick="wish()">

Open Gift 🎁

</button>

</div>

</div>


<script>

/* countdown */

const birthday=
new Date("May 18, 2026 00:00:00").getTime();


const x=setInterval(()=>{

const now=
new Date().getTime();

const distance=
birthday-now;


if(distance<=0){

clearInterval(x);

document.getElementById(
"countdownScreen"
).style.display="none";


document.getElementById(
"mainPage"
).style.display="flex";


createFireworks();

return;

}


const days=Math.floor(distance/(1000*60*60*24));

const hours=Math.floor(
(distance%(1000*60*60*24))
/
(1000*60*60)
);

const minutes=Math.floor(
(distance%(1000*60*60))
/
(1000*60)
);

const seconds=Math.floor(
(distance%(1000*60))
/
1000
);


document.getElementById(
"timer"
).innerHTML=

`${days}d ${hours}h ${minutes}m ${seconds}s`;

},1000);



for(let i=0;i<80;i++){

let c=document.createElement("div");

c.className="confetti";

c.style.left=Math.random()*100+"vw";

c.style.background=
`hsl(${Math.random()*360},100%,50%)`;

c.style.animationDuration=
(Math.random()*4+3)+"s";

document.body.appendChild(c);

}


function wish(){

alert(
"🎂 Have the happiest birthday ever ❤️"
)

}

function createFireworks(){

for(let i=0;i<40;i++){

let f=document.createElement("div");

f.style.position="absolute";

f.style.width="8px";

f.style.height="8px";

f.style.borderRadius="50%";

f.style.background=
`hsl(${Math.random()*360},100%,50%)`;

f.style.left=
Math.random()*100+"vw";

f.style.top=
Math.random()*80+"vh";

f.style.boxShadow=
"0 0 20px white";

document.body.appendChild(f);

setTimeout(()=>{

f.remove()

},2000)

}

}

setInterval(createFireworks,3000);

</script>

</body>
</html>
