
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Birthday Surprise 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{height:100vh;overflow:hidden;display:flex;justify-content:center;align-items:center;flex-direction:column;font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#0f172a,#1e293b,#312e81);background-size:300% 300%;animation:bgMove 15s infinite;position:relative;color:white}
@keyframes bgMove{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}

.floatingPhoto{position:absolute;opacity:.25;pointer-events:none;z-index:1;animation:floatPhoto linear infinite,rotatePhoto 12s linear infinite}
@keyframes rotatePhoto{100%{transform:rotate(360deg)}}
@keyframes floatPhoto{0%{top:110vh}100%{top:-150px}}

.glitter{position:absolute;width:3px;height:3px;background:white;border-radius:50%;opacity:.4;animation:twinkle 4s infinite}
@keyframes twinkle{50%{opacity:1;transform:scale(1.8)}}

h1{font-family:Pacifico;font-size:38px;margin-bottom:20px;z-index:2}
.card{width:92%;max-width:360px;padding:25px;background:rgba(255,255,255,.08);backdrop-filter:blur(16px);border-radius:30px;text-align:center;z-index:2}
#fullCake{font-size:120px;position:relative;animation:bounce 2s infinite}
@keyframes bounce{50%{transform:translateY(-8px)}}
.candles{position:absolute;top:-15px;left:50%;transform:translateX(-50%);display:flex;gap:14px}
.candle{width:8px;height:35px;background:white;position:relative}
.flame{position:absolute;top:-12px;left:50%;transform:translateX(-50%) rotate(-45deg);width:12px;height:12px;background:#ff9f1c;border-radius:50% 50% 50% 0;animation:flicker .5s infinite alternate}
button{margin-top:20px;padding:14px 28px;border:none;border-radius:50px;cursor:pointer}
#knifeArea,#pieces,#surpriseArea{display:none}
#pieces{justify-content:center;gap:60px;font-size:80px}
.message{opacity:0;font-family:Pacifico;font-size:28px;margin-top:20px;transition:1s}
.finalPhoto{position:relative;width:180px;height:180px;margin:auto}
.photoFrame{position:absolute;width:190px;height:190px;border-radius:50%;background:conic-gradient(#ff4d8d,#ffd700,#00e5ff,#b84dff,#ff4d8d);animation:ringRotate 6s linear infinite}
.photoFrame::before{content:"";position:absolute;inset:8px;border-radius:50%;background:#121826}
.finalPhoto img{position:relative;z-index:2;width:165px;height:165px;border-radius:50%;object-fit:cover;margin-top:12px}
@keyframes ringRotate{100%{transform:rotate(360deg)}}
.giftBox{font-size:65px;margin-top:20px;cursor:pointer}
#giftMessage{opacity:0;margin-top:10px;transition:1s}
</style>
</head>
<body>
<div id="photoBg"></div>
<h1>🎂 Happy Birthday 🎂 <br> Dipika😘❤️ </h1>
<div class="card">
<div id="fullCake">🎂
<div class="candles">
<div class="candle"><div class="flame"></div></div>
<div class="candle"><div class="flame"></div></div>
<div class="candle"><div class="flame"></div></div>
</div>
</div>
<button id="blowBtn" onclick="blow()">Blow Candles 💨</button>
<div id="knifeArea"><div style="font-size:60px">🔪</div><button onclick="cutCake()">Cut Cake 🎂</button></div>
<div id="pieces"><div id="leftPiece">🍰</div><div id="rightPiece">🍰</div></div>
<div class="message" id="msg">Happy Birthday My Love ❤️</div>
<div id="surpriseArea">
<div class="finalPhoto"><div class="photoFrame"></div><img src="10.jpg"></div>
<div class="giftBox" onclick="openGift()">🎁</div>
</div>
<div id="giftMessage">Happy Birthday! again, 🎂❤️ When we meet, your gift is waiting—ask for anything you want.😘❤️</div>
</div>
<script>
for(let i=0;i<45;i++){let g=document.createElement('div');g.className='glitter';g.style.left=Math.random()*100+'vw';g.style.top=Math.random()*100+'vh';document.body.appendChild(g)}
const bgImgs=['1.jpg','2.jpg','3.jpg','4.jpg','5.jpg','6.jpg'];
function createFloatingPhoto(){let p=document.createElement('img');p.src=bgImgs[Math.floor(Math.random()*bgImgs.length)];p.className='floatingPhoto';p.style.left=Math.random()*100+'vw';p.style.width=(Math.random()*50+60)+'px';p.style.animationDuration=(Math.random()*12+10)+'s';photoBg.appendChild(p);setTimeout(()=>p.remove(),22000)}
for(let i=0;i<25;i++)setTimeout(createFloatingPhoto,i*300)
setInterval(createFloatingPhoto,700)
function blow(){document.querySelectorAll('.flame').forEach(f=>f.style.opacity=0);blowBtn.style.display='none';setTimeout(()=>knifeArea.style.display='block',1000)}
function cutCake(){fullCake.style.display='none';knifeArea.style.display='none';pieces.style.display='flex';setTimeout(()=>{msg.style.opacity=1;surpriseArea.style.display='block'},1000)}
function openGift(){document.querySelector('.giftBox').innerHTML='💝';giftMessage.style.opacity=1}
</script>
</body>
</html>
